<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Hi

    <div class="container">
      <button id="addbutton">+</button>
      <form id="formAddTodo">
        <dialog class="input-dialog">
          <label for="title">Title:</label
          ><input type="text" name="title" id="title" />
          <label for="description">Description</label
          ><input type="text" name="description" id="description" />
          <input type="date" name="dueDate" id="dueDate" />
          <input type="checkbox" name="isPriority" id="isPriority" />
          <button type="submit" id="submitToDo">Submit</button>
        </dialog>
      </form>

      <form id="formEditTodo">
        <dialog class="edit-dialog">
          <label for="newtitle">Title:</label
          ><input
            type="text"
            name="newtitle"
            id="newtitle"
            placeholder="thisis edit"
          />
          <label for="newDescription">Description</label
          ><input type="text" name="newDescription" id="newDescription" />
          <input type="date" name="newDate" id="newDate" />
          <input type="checkbox" name="newPriority" id="newPriority" />
          <button type="submit" id="edToDo">Submit</button>
        </dialog>
      </form>

      <div class="library"></div>
    </div>
  </body>
</html>
